name: run-test

on:
  pull_request:
    branches: [main]
  push:
    paths:
      - '**'
      - '!LICENSE'
      - '!*.md'
      - '!.github/**'
      - '!.vscode/**'
      - '!docs/**'
      - '.github/workflows/run-test.yml'
  # trigger deployment manually
  workflow_dispatch:

jobs:
  # Neither the formatting nor the lint rules depend on the platform or on the
  # version of Node.js, so they are checked once instead of once per entry of
  # the matrix below.
  check-format-and-lint:
    runs-on: ubuntu-latest
    name: Check formatting and lint rules

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      # Reported rather than repaired: `npm run build` used to reformat the
      # sources it was about to build, so a formatting problem never failed.
      - run: npm run format:check
      - run: npm run lint

  build-and-run-test:
    runs-on: ${{ matrix.os }}
    name: Test module from Node.js ${{ matrix.node_version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node_version: ['22', '24', '26']
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
        name: Setup Node.js ${{ matrix.node_version }}
        with:
          # fetch all commits to get last updated time or other git log info
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm run test

  # VitePress 2 is still a pre-release, so it is checked once rather than across
  # the matrix above: what differs between the two majors is the module this
  # package calls, not the platform it runs on. The pre-release also changes
  # without any change here, so a break in it is reported without turning the
  # whole run red.
  build-and-run-test-vitepress-next:
    runs-on: ubuntu-latest
    name: Test module against the VitePress pre-release
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5
        with:
          # fetch all commits to get last updated time or other git log info
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      # Installed over the version the lockfile pins, without writing it down,
      # so the checked-in dependency stays the released VitePress.
      - run: npm install --no-save vitepress@next
      - run: npm run test
